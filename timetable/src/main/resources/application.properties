# ===============================
# = Profiles
# ===============================
# Loads application-loc.properties on top of this file. That file holds everything
# environment-specific — the database credentials, the JWT signing key and the R2DBC
# SQL/param debug logging — so this file carries only values that are the same everywhere.
spring.profiles.active=loc


# ===============================
# = Database (R2DBC)
# ===============================
# Dedicated 'timetable' database. Run src/main/resources/db/schema.sql and data.sql against it once.
# Credentials live in application-loc.properties.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/lnu-timetable
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=512


# ===============================
# = Schema migrations (Flyway)
# ===============================
# Flyway is a JDBC tool and this service is an R2DBC one, so it needs the same database addressed
# a second way. The two URLs are the only place in the configuration that says where the database
# is twice — change them together, or Flyway will migrate a different database than the one the
# application then reads.
spring.flyway.url=jdbc:postgresql://localhost:5432/lnu-timetable
# The credentials are not repeated: they are stated once, in application-loc.properties, and read
# from there. See scripts/reset_db.sh for the third reader of the same two values.
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}
#
# The schema is still created by db/schema.sql, not by Flyway — see the README's *Known
# limitations*. Flyway's job here is to carry an already-created database forward, which is what
# these two lines say: baseline an existing schema rather than refusing to touch it, and baseline
# it at version 0 rather than at 1, so that V1 applies to a database seeded before Flyway existed
# exactly as it does to one seeded today. A database with no schema at all is not a case this
# handles: the first migration will fail against it, which is the correct answer to running the
# service against a database nobody has created yet.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# ===============================
# = GraphiQL
# ===============================
spring.graphql.graphiql.enabled=true


# ===============================
# = Authentication (see org.lnu.timetable.security)
# ===============================
# How long an issued token stays valid, in minutes (720 = 12 hours).
# The HS256 signing key lives in application-loc.properties.
app.security.jwt-ttl-minutes=720

# How long a registration or password-recovery link stays good, in minutes, and the two limits on
# how often one may be asked for. They bound different things and both are needed: the cooldown is
# per address and stops one inbox being filled, while the per-minute cap is over every address at
# once and stops the mailbox itself being used as a cannon by a script walking a list of published
# university addresses — which trips no per-address limit at all. Both refusals answer
# TOO_MANY_REQUESTS, since from outside they are the same "not now".
app.security.account-token-ttl-minutes=30
app.security.account-token-cooldown-seconds=60
app.security.account-token-max-per-minute=20


# ===============================
# = Outgoing mail (see org.lnu.timetable.mail.MailService)
# ===============================
# Office 365, submission port, STARTTLS. Host and port are properties rather than constants so a
# different relay can be pointed at without touching code — a departmental one, or a local capture
# server during development.
#
# The mailbox itself is a *credential* and is therefore not written down here: MAIL_USERNAME and
# MAIL_PASSWORD are read from the environment, and the defaults below are empty, so a service
# started without them starts normally and reports MAIL_FAILED on the first attempt to send rather
# than refusing to boot. Two things Microsoft's side decides, and neither is visible from here: SMTP
# AUTH is disabled per mailbox by default and has to be enabled for timetable@lnu.edu.ua, and a
# mailbox with multi-factor authentication cannot use its own password at all — it needs an app
# password.
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Without these three a relay that accepts the connection and then says nothing holds the sending
# thread — one of a bounded pool — until the socket times out on the operating system's schedule.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# The From address defaults to whatever MAIL_USERNAME is authenticating as, because Office 365
# rejects a From the authenticated mailbox has no right to send as. Set app.mail.from only for a
# mailbox that genuinely holds Send As on another address.
app.mail.from=
#
# app.mail.from-name is deliberately *not* set here. Spring Boot reads a .properties file as
# ISO-8859-1 (java.util.Properties' own rule, which OriginTrackedPropertiesLoader keeps), so a
# Cyrillic value written in this file arrives mangled. The display name is Ukrainian, so its default
# lives in MailService's @Value instead, where the compiler's UTF-8 applies. Overriding it needs a
# channel that carries UTF-8: an environment variable, SPRING_APPLICATION_JSON, or a YAML file.


# ===============================
# = Where this instance is reachable
# ===============================
# What the links in those e-mails are built from. This value is the one the packaged jar wants: the
# service serves the Angular client on every path that is not /graphql, so its own address is also
# the client's. Development is the exception and overrides it in application-loc.properties, where
# the client runs on its own port. Set it to the public address before deploying anywhere real — a
# link to localhost in somebody's inbox is a dead link.
app.base-url=http://localhost:8080
