# ===============================
# = Database (R2DBC)
# ===============================
# Dedicated 'timetable' database. Run src/main/resources/db/schema.sql and data.sql against it once.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/timetable
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres47
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=512


# ===============================
# = GraphiQL
# ===============================
spring.graphql.graphiql.enabled=true


# ===============================
# = Logging (show generated SQL)
# ===============================
logging.level.io.r2dbc.postgresql.QUERY=DEBUG
logging.level.io.r2dbc.postgresql.PARAM=DEBUG
