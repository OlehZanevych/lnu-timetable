# ===============================
# = Database (R2DBC)
# ===============================
# Dedicated 'timetable' database. Run src/main/resources/db/schema.sql and data.sql against it once.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/lnu-timetable
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres47
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=512


# ===============================
# = GraphiQL
# ===============================
spring.graphql.graphiql.enabled=true


# ===============================
# = Authentication (see org.lnu.timetable.security)
# ===============================
# HS256 signing key for login JWTs — must be at least 32 bytes. Local-dev-only value below;
# override with an environment-specific secret (e.g. via SPRING_APPLICATION_JSON or an env var)
# before deploying anywhere real.
app.security.jwt-secret=vFhvq86LU85HrhoVaf7i4P5GErwPZnAIe3rFF5c8-Ch0jmzce3DRwHMIn_pi3pjL
# How long an issued token stays valid, in minutes (720 = 12 hours).
app.security.jwt-ttl-minutes=720


# ===============================
# = Logging (show generated SQL)
# ===============================
logging.level.io.r2dbc.postgresql.QUERY=DEBUG
logging.level.io.r2dbc.postgresql.PARAM=DEBUG
