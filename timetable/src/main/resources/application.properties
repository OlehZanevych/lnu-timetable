# ===============================
# = Profiles
# ===============================
# Loads application-loc.properties on top of this file. That file holds everything
# environment-specific — the database credentials, the JWT signing key and the R2DBC
# SQL/param debug logging — so this file carries only values that are the same everywhere.
spring.profiles.active=loc


# ===============================
# = Database (R2DBC)
# ===============================
# Dedicated 'timetable' database. Run src/main/resources/db/schema.sql and data.sql against it once.
# Credentials live in application-loc.properties.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/lnu-timetable
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=10
spring.r2dbc.pool.max-size=512


# ===============================
# = Schema migrations (Flyway)
# ===============================
# Flyway is a JDBC tool and this service is an R2DBC one, so it needs the same database addressed
# a second way. The two URLs are the only place in the configuration that says where the database
# is twice — change them together, or Flyway will migrate a different database than the one the
# application then reads.
spring.flyway.url=jdbc:postgresql://localhost:5432/lnu-timetable
# The credentials are not repeated: they are stated once, in application-loc.properties, and read
# from there. See scripts/reset_db.sh for the third reader of the same two values.
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}
#
# The schema is still created by db/schema.sql, not by Flyway — see the README's *Known
# limitations*. Flyway's job here is to carry an already-created database forward, which is what
# these two lines say: baseline an existing schema rather than refusing to touch it, and baseline
# it at version 0 rather than at 1, so that V1 applies to a database seeded before Flyway existed
# exactly as it does to one seeded today. A database with no schema at all is not a case this
# handles: the first migration will fail against it, which is the correct answer to running the
# service against a database nobody has created yet.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# ===============================
# = GraphiQL
# ===============================
spring.graphql.graphiql.enabled=true


# ===============================
# = Authentication (see org.lnu.timetable.security)
# ===============================
# How long an issued token stays valid, in minutes (720 = 12 hours).
# The HS256 signing key lives in application-loc.properties.
app.security.jwt-ttl-minutes=720
