# ===============================
# = Local profile ('loc')
# ===============================
# Activated by spring.profiles.active=loc in application.properties, and read directly by
# scripts/reset_db.sh, scripts/backup_data.sh and scripts/renumber_ids.sh.
#
# Everything here is environment-specific. The values below are local-dev-only — override
# them (SPRING_APPLICATION_JSON, environment variables, or a profile of your own) before
# deploying anywhere real.


# ===============================
# = Database credentials (R2DBC)
# ===============================
# The connection URL and pool sizing stay in application.properties; only the credentials
# are here.
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres47


# ===============================
# = Authentication (see org.lnu.timetable.security)
# ===============================
# HS256 signing key for login JWTs — must be at least 32 bytes.
app.security.jwt-secret=vFhvq86LU85HrhoVaf7i4P5GErwPZnAIe3rFF5c8-Ch0jmzce3DRwHMIn_pi3pjL


# ===============================
# = Web (see org.lnu.timetable.controller)
# ===============================
# true  -> GET / redirects to Apollo Studio Sandbox, aimed at this instance's /graphql (IndexController).
# false, absent, or anything else -> GET / and every Angular route serve the built client from
#          src/main/resources/static (FrontendController). That is what a packaged deployment wants,
#          so run the jar with --app.apollo-sandbox.enabled=false (see scripts/build-app.sh).
app.apollo-sandbox.enabled=true


# ===============================
# = Logging (show generated SQL)
# ===============================
logging.level.io.r2dbc.postgresql.QUERY=DEBUG
logging.level.io.r2dbc.postgresql.PARAM=DEBUG
