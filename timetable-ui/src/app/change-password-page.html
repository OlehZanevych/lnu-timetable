<div class="login-wrap">
  <div class="card login-card">
    <h2>Зміна пароля</h2>
    <p class="muted">
      @if (forced) {
        Це тимчасовий пароль — перш ніж продовжити, встановіть новий.
      } @else {
        Введіть поточний та новий пароль.
      }
    </p>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <form (ngSubmit)="submit()" class="entity-form login-form">
      <label>
        <span>Поточний пароль</span>
        <input type="password" [(ngModel)]="currentPassword" name="currentPassword" required autocomplete="current-password" />
      </label>
      <label>
        <span>Новий пароль (мінімум 8 символів)</span>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="8" autocomplete="new-password" />
      </label>
      <label>
        <span>Підтвердіть новий пароль</span>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password" />
      </label>
      <div class="actions">
        <button type="submit" [disabled]="submitting()">{{ submitting() ? 'Збереження…' : 'Зберегти новий пароль' }}</button>
      </div>
    </form>
  </div>
</div>
