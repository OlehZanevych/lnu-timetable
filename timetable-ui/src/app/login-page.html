<div class="login-wrap">
  <div class="card login-card">
    <h2>Вхід у систему</h2>
    <p class="muted">Львівський національний університет імені Івана Франка</p>

    @if (sessionNotice() && !error()) {
      <p class="session-notice">{{ sessionNotice() }}</p>
    }

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <form (ngSubmit)="submit()" class="entity-form login-form">
      <label>
        <span>Ел. пошта</span>
        <input type="email" [(ngModel)]="email" name="email" required autocomplete="username" />
      </label>
      <label>
        <span>Пароль</span>
        <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" />
      </label>
      <div class="actions">
        <button type="submit" [disabled]="submitting()">{{ submitting() ? 'Вхід…' : 'Увійти' }}</button>
      </div>
    </form>

    <p class="muted login-hint">
      Реєстрація самостійно недоступна — обліковий запис створює адміністратор системи.
    </p>
  </div>
</div>
